apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: sre-space
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
    exporters:
      otlp:
        endpoint: otlp.nr-data.net:4317
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY}
      logging:
        loglevel: debug
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp, logging]
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp, logging]
        logs:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp, logging]
